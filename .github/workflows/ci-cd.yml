name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore DistributedRateLimiter.sln

    - name: Build Solution (Release)
      run: dotnet build DistributedRateLimiter.sln --configuration Release --no-restore

    - name: Execute Automated Unit & Integration Tests
      run: dotnet test DistributedRateLimiter.sln --configuration Release --no-build --verbosity normal

  docker-build:
    name: Build & Validate Container Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/DistributedRateLimiter.Api/Dockerfile
        push: false
        tags: distributed-rate-limiter:latest
